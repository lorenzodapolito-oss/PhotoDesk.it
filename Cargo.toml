[package]
name = "photodesk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PhotoDesk: an image browser that launches DarkRaw and LightRaw"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# Volume names and types for the drives in the folder tree.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
